<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remote Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: #1e293b; display: flex; align-items: center; padding: 0 1rem; gap: 1rem; z-index: 10; }
    #toolbar span { color: #38bdf8; font-size: .85rem; font-weight: bold; }
    #toolbar .status { font-size: .75rem; color: #4ade80; }
    #toolbar button { padding: .3rem .6rem; font-size: .75rem; background: #334155; color: #e2e8f0; border: none; border-radius: 3px; cursor: pointer; }
    #toolbar button:hover { background: #475569; }
    #toolbar input[type=range] { width: 80px; }
    #toolbar label { font-size: .7rem; color: #94a3b8; }
    #canvas-container { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100%; max-height: 100%; cursor: default; }
    #connecting { color: #94a3b8; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="title">Remote Desktop</span>
    <span class="status" id="status">Connecting...</span>
    <label>Quality: <input type="range" id="quality" min="20" max="90" value="50" oninput="setQuality(this.value)"></label>
    <label>FPS: <input type="range" id="fps" min="1" max="15" value="5" oninput="setFps(this.value)"></label>
    <button onclick="sendCtrlAltDel()">Ctrl+Alt+Del</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="window.close()">Disconnect</button>
  </div>
  <div id="canvas-container">
    <canvas id="screen"></canvas>
    <div id="connecting">Connecting...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const machineId = params.get('id');
    const hostname = params.get('hostname') || machineId;

    document.getElementById('title').textContent = `Remote: ${hostname}`;

    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    let ws = null;
    let scaleX = 1, scaleY = 1;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/remote?token=${token}&id=${machineId}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('connecting').style.display = 'none';
      };

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) {
          const blob = new Blob([e.data], { type: 'image/jpeg' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            if (canvas.width !== img.width || canvas.height !== img.height) {
              canvas.width = img.width;
              canvas.height = img.height;
              updateScale();
            }
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
          };
          img.src = url;
        }
      };

      ws.onclose = () => {
        document.getElementById('status').textContent = 'Disconnected';
        document.getElementById('status').style.color = '#f87171';
      };
    }

    function updateScale() {
      const rect = canvas.getBoundingClientRect();
      scaleX = canvas.width / rect.width;
      scaleY = canvas.height / rect.height;
    }
    window.addEventListener('resize', updateScale);

    // Mouse events
    canvas.addEventListener('mousemove', (e) => {
      if (!ws || ws.readyState !== 1) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * scaleX);
      const y = Math.round((e.clientY - rect.top) * scaleY);
      ws.send('__INPUT__' + JSON.stringify({ type: 'mousemove', x, y }));
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!ws || ws.readyState !== 1) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * scaleX);
      const y = Math.round((e.clientY - rect.top) * scaleY);
      ws.send('__INPUT__' + JSON.stringify({ type: 'mousedown', x, y, button: e.button }));
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Keyboard events
    document.addEventListener('keydown', (e) => {
      if (!ws || ws.readyState !== 1) return;
      e.preventDefault();
      ws.send('__INPUT__' + JSON.stringify({ type: 'keydown', key: e.key, code: e.code, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey }));
    });

    // Controls
    function setQuality(val) {
      if (ws && ws.readyState === 1) ws.send('__INPUT__' + JSON.stringify({ type: 'settings', quality: parseInt(val) }));
    }
    function setFps(val) {
      if (ws && ws.readyState === 1) ws.send('__INPUT__' + JSON.stringify({ type: 'settings', fps: parseInt(val) }));
    }
    function sendCtrlAltDel() {
      if (ws && ws.readyState === 1) ws.send('__INPUT__' + JSON.stringify({ type: 'ctrl-alt-del' }));
    }
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }

    connect();
  </script>
</body>
</html>
