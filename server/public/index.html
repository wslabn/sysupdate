<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SysUpdate Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
    #login form { background: #1e293b; padding: 2rem; border-radius: 8px; width: 300px; }
    #login h2 { margin-bottom: 1.5rem; color: #38bdf8; }
    input, select { width: 100%; padding: .6rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; }
    button { padding: .5rem 1rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.secondary { background: #334155; color: #e2e8f0; }
    button.danger { background: #ef4444; color: #fff; }
    button.full { width: 100%; }
    #dashboard { display: none; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    header h1 { color: #38bdf8; }
    .toolbar { display: flex; gap: .5rem; align-items: center; }
    .customer-group { background: #1e293b; border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
    .customer-header { display: flex; justify-content: space-between; align-items: center;
      padding: .75rem 1rem; background: #334155; cursor: pointer; user-select: none; }
    .customer-header h3 { font-size: .95rem; }
    .customer-group.collapsed .group-body { display: none; }
    .customer-header span { color: #94a3b8; font-size: .8rem; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: .6rem 1rem; text-align: left; font-size: .8rem; color: #94a3b8; background: #1e293b; }
    td { padding: .65rem 1rem; border-top: 1px solid #334155; font-size: .85rem; }
    tr:hover td { background: #263548; cursor: pointer; }
    .online { color: #4ade80; } .stale { color: #facc15; } .offline { color: #f87171; }

    /* Detail panel */
    #detail { display: none; position: fixed; top: 0; right: 0; width: 620px; height: 100vh;
      background: #1e293b; border-left: 1px solid #334155; flex-direction: column; }
    #detail.open { display: flex; }
    #detail-top { padding: 1.5rem 1.5rem 0; }
    #detail h2 { color: #38bdf8; margin-bottom: .75rem; }
    #detail .close { float: right; cursor: pointer; color: #94a3b8; font-size: 1.2rem; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
    .detail-actions button { font-size: .8rem; padding: .4rem .75rem; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid #334155; padding: 0 1.5rem; }
    .tab { padding: .6rem 1rem; font-size: .82rem; color: #94a3b8; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .tab-content { flex: 1; overflow-y: auto; padding: 1.5rem; display: none; }
    .tab-content.active { display: block; }

    /* Shared detail styles */
    .section-title { color: #94a3b8; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; margin: 1rem 0 .5rem; }
    .section-title:first-child { margin-top: 0; }
    .hw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
    .hw-row { display: flex; flex-direction: column; background: #0f172a; padding: .5rem .75rem; border-radius: 4px; font-size: .8rem; }
    .hw-row span:first-child { color: #94a3b8; font-size: .7rem; margin-bottom: .15rem; }
    .info-card { background: #0f172a; padding: .75rem; border-radius: 4px; margin-bottom: .5rem; border-left: 3px solid #334155; }
    .event { background: #0f172a; padding: .75rem; border-radius: 4px; margin-bottom: .5rem; border-left: 3px solid #ef4444; }
    .event .evt-meta { display: flex; gap: 1rem; margin-bottom: .35rem; font-size: .75rem; color: #94a3b8; }
    .event .evt-msg { font-size: .82rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    /* Terminal */
    #terminal-container { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 45vh;
      background: #0f172a; border-top: 2px solid #38bdf8; z-index: 100; flex-direction: column; }
    #terminal-container.open { display: flex; }
    #terminal-header { display: flex; justify-content: space-between; align-items: center;
      padding: .5rem 1rem; background: #1e293b; }
    #terminal-header span { color: #38bdf8; font-size: .85rem; font-weight: bold; }
    #terminal-output { flex: 1; overflow-y: auto; padding: .75rem 1rem; font-family: 'Courier New', monospace;
      font-size: .82rem; white-space: pre-wrap; word-break: break-all; color: #e2e8f0; }
    #terminal-input { display: flex; border-top: 1px solid #334155; }
    #terminal-input input { flex: 1; background: #1e293b; border: none; padding: .6rem 1rem;
      color: #4ade80; font-family: 'Courier New', monospace; font-size: .85rem; outline: none; }
    #terminal-input button { padding: .6rem 1rem; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; cursor: pointer; }

    #error { color: #f87171; margin-top: .5rem; font-size: .85rem; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #1e293b; padding: 1.5rem; border-radius: 8px; width: 340px; }
    .modal h3 { margin-bottom: 1rem; color: #38bdf8; }
    .modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }
    .empty { padding: 1rem; color: #94a3b8; font-size: .85rem; text-align: center; }
    .muted { color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>

<div id="login">
  <form onsubmit="login(event)">
    <h2>SysUpdate</h2>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" class="full">Login</button>
    <div id="error"></div>
  </form>
</div>

<div id="dashboard">
  <header>
    <h1>SysUpdate Dashboard</h1>
    <div class="toolbar">
      <select id="jump" onchange="jumpTo(this)" style="width:180px;margin-bottom:0">
        <option value="">Jump to customer...</option>
      </select>
      <button class="secondary" onclick="openNewCustomer()">+ Customer</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </header>
  <div id="groups"></div>
</div>

<!-- Machine detail panel -->
<div id="detail">
  <div id="detail-top">
    <span class="close" onclick="closeDetail()">&#x2715;</span>
    <h2 id="detail-hostname"></h2>
    <div id="detail-version" style="font-size:.75rem;color:#94a3b8;margin-bottom:.75rem"></div>
    <div class="detail-actions">
      <button onclick="openTerminal()">Terminal</button>
      <button onclick="sendCommand('update-drivers')">Update Drivers</button>
      <button onclick="sendCommand('update-client')">Push Update</button>
      <button class="danger" onclick="sendCommand('reboot')">Reboot</button>
      <button class="danger" onclick="deleteMachine()">Delete</button>
    </div>
    <div style="margin-bottom:.75rem">
      <label style="font-size:.8rem;color:#94a3b8">Customer</label>
      <select id="detail-customer" onchange="assignCustomer()"></select>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">Overview</div>
    <div class="tab" onclick="switchTab('storage')">Storage</div>
    <div class="tab" onclick="switchTab('network')">Network</div>
    <div class="tab" onclick="switchTab('updates')">Updates</div>
    <div class="tab" onclick="switchTab('events')">Events</div>
  </div>

  <div class="tab-content active" id="tab-overview">
    <div class="section-title">Hardware</div>
    <div id="detail-hw"></div>
    <div class="section-title">Diagnostics</div>
    <div id="detail-diag"></div>
  </div>

  <div class="tab-content" id="tab-storage">
    <div class="section-title">Disk Space</div>
    <div id="detail-disks"></div>
  </div>

  <div class="tab-content" id="tab-network">
    <div class="section-title">Network Adapters</div>
    <div id="detail-network"></div>
  </div>

  <div class="tab-content" id="tab-updates">
    <div class="section-title">Windows Updates</div>
    <div id="detail-wu"></div>
    <div class="section-title">Driver Updates</div>
    <div id="detail-driver-update"></div>
  </div>

  <div class="tab-content" id="tab-events">
    <div class="section-title">Recent System Errors</div>
    <div id="detail-events"></div>
  </div>
</div>

<!-- Remote terminal -->
<div id="terminal-container">
  <div id="terminal-header">
    <span id="terminal-title">Terminal</span>
    <button class="danger" onclick="closeTerminal()" style="padding:.25rem .6rem;font-size:.75rem">Close</button>
  </div>
  <div id="terminal-output"></div>
  <div id="terminal-input">
    <input type="text" id="term-cmd" placeholder="Type a command..." onkeydown="if(event.key==='Enter')sendTermCmd()">
    <button onclick="sendTermCmd()">Send</button>
  </div>
</div>

<!-- New customer modal -->
<div class="modal-bg" id="customer-modal">
  <div class="modal">
    <h3>New Customer</h3>
    <input type="text" id="customer-name" placeholder="Customer name">
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button onclick="createCustomer()">Create</button>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token');
  let customers = [], machines = [], currentMachineId = null;
  if (token) showDashboard();

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers }
    });
    if (res.status === 401) { logout(); return; }
    return res.json();
  }

  async function login(e) {
    e.preventDefault();
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    if (!res.ok) { document.getElementById('error').textContent = 'Invalid password'; return; }
    token = (await res.json()).token;
    localStorage.setItem('token', token);
    showDashboard();
  }

  function logout() {
    localStorage.removeItem('token'); token = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
  }

  async function showDashboard() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadAll();
    setInterval(loadAll, 30000);
  }

  async function loadAll() {
    [customers, machines] = await Promise.all([api('/api/customers'), api('/api/machines')]);
    renderGroups();
  }

  function status(last_seen) {
    const age = (Date.now() - new Date(last_seen)) / 60000;
    if (age < 70) return '<span class="online">&#x25CF; Online</span>';
    if (age < 1440) return '<span class="stale">&#x25CF; Stale</span>';
    return '<span class="offline">&#x25CF; Offline</span>';
  }

  function machineRow(m) {
    return `<tr onclick="showDetail('${m.id}')">
      <td>${m.hostname}</td>
      <td>${m.hardware?.cpu || '—'}</td>
      <td>${m.hardware?.model || '—'}</td>
      <td>${new Date(m.last_seen).toLocaleString()}</td>
      <td>${status(m.last_seen)}</td>
    </tr>`;
  }

  function groupBlock(title, machineList, customerId) {
    const deleteBtn = customerId
      ? `<button class="danger" style="padding:.25rem .6rem;font-size:.75rem" onclick="removeCustomer('${customerId}',event)">Delete</button>`
      : '';
    const collapsed = (JSON.parse(localStorage.getItem('collapsed') || '{}')[customerId || 'unassigned']) ? 'collapsed' : '';
    const rows = machineList.length
      ? machineList.map(machineRow).join('')
      : `<tr><td colspan="5" class="empty">No machines assigned</td></tr>`;
    return `<div class="customer-group ${collapsed}" data-id="${customerId || 'unassigned'}">
      <div class="customer-header" onclick="toggleGroup(this)">
        <h3>&#x25BE; ${title}</h3>
        <div style="display:flex;gap:.5rem;align-items:center">
          <span>${machineList.length} machine${machineList.length !== 1 ? 's' : ''}</span>
          ${deleteBtn}
        </div>
      </div>
      <div class="group-body">
        <table>
          <thead><tr><th>Hostname</th><th>CPU</th><th>Model</th><th>Last Seen</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  function renderGroups() {
    const assigned = new Set();
    let html = customers.map(c => {
      const list = machines.filter(m => m.customer_id === c.id);
      list.forEach(m => assigned.add(m.id));
      return groupBlock(c.name, list, c.id);
    }).join('');
    const unassigned = machines.filter(m => !assigned.has(m.id));
    html += groupBlock('Unassigned', unassigned, null);
    document.getElementById('groups').innerHTML = html;

    const jump = document.getElementById('jump');
    jump.innerHTML = '<option value="">Jump to customer...</option>' +
      customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('') +
      '<option value="unassigned">Unassigned</option>';
  }

  function jumpTo(sel) {
    if (!sel.value) return;
    const el = document.querySelector(`.customer-group[data-id="${sel.value}"]`);
    if (!el) return;
    if (el.classList.contains('collapsed')) el.querySelector('.customer-header').click();
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    sel.value = '';
  }

  // --- Tabs ---
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  // --- Detail panel ---
  async function showDetail(id) {
    currentMachineId = id;
    const m = await api(`/api/machines/${id}`);
    document.getElementById('detail-hostname').textContent = m.hostname;
    document.getElementById('detail-version').textContent = m.clientVersion ? `Client v${m.clientVersion}` : 'Version unknown';

    // Customer select
    const sel = document.getElementById('detail-customer');
    sel.innerHTML = `<option value="">— Unassigned —</option>` +
      customers.map(c => `<option value="${c.id}" ${m.customer_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

    // Overview tab - Hardware
    document.getElementById('detail-hw').innerHTML = `<div class="hw-grid">` +
      Object.entries(m.hardware || {}).map(([k, v]) =>
        `<div class="hw-row"><span>${k}</span><span>${v}</span></div>`
      ).join('') + '</div>';

    // Overview tab - Diagnostics
    const diag = m.diagnostics;
    document.getElementById('detail-diag').innerHTML = diag
      ? `<div class="hw-grid">
          <div class="hw-row"><span>Uptime</span><span>${diag.uptime_hours}h</span></div>
          <div class="hw-row"><span>Last Boot</span><span>${diag.last_boot}</span></div>
          <div class="hw-row"><span>Pending Reboot</span><span style="color:${diag.pending_reboot ? '#ef4444' : '#4ade80'}">${diag.pending_reboot ? 'Yes' : 'No'}</span></div>
        </div>`
      : '<p class="muted">No data yet</p>';

    // Storage tab
    const disks = m.disks || [];
    document.getElementById('detail-disks').innerHTML = disks.length
      ? disks.map(d => `<div class="info-card" style="border-left-color:${d.percent_free < 10 ? '#ef4444' : d.percent_free < 25 ? '#facc15' : '#4ade80'}">
          <div style="font-size:.85rem;font-weight:bold">${d.drive}</div>
          <div style="font-size:.82rem;margin-top:.25rem">${d.free_gb} GB free / ${d.size_gb} GB total (${d.percent_free}% free)</div>
          <div style="margin-top:.4rem;height:6px;background:#334155;border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${100-d.percent_free}%;background:${d.percent_free < 10 ? '#ef4444' : d.percent_free < 25 ? '#facc15' : '#4ade80'}"></div>
          </div>
        </div>`).join('')
      : '<p class="muted">No data yet</p>';

    // Network tab
    const nets = diag?.network_adapters || [];
    document.getElementById('detail-network').innerHTML = nets.length
      ? nets.map(n => `<div class="info-card">
          <div style="font-size:.82rem;font-weight:bold">${n.name}</div>
          <div style="font-size:.8rem;color:#94a3b8;margin-top:.25rem">IP: ${n.ip || 'N/A'} &nbsp; MAC: ${n.mac || 'N/A'}</div>
        </div>`).join('')
      : '<p class="muted">No data yet</p>';

    // Updates tab
    const wu = m.windowsUpdate;
    document.getElementById('detail-wu').innerHTML = wu
      ? `<div class="info-card" style="border-left-color:${wu.missing>0?'#facc15':'#4ade80'}">
          <div style="font-size:.85rem">${wu.missing > 0 ? wu.missing + ' update(s) pending' : 'Up to date'}</div>
          <div style="font-size:.75rem;color:#94a3b8;margin-top:.25rem">Last installed: ${wu.last_install}</div>
        </div>`
      : '<p class="muted">No data yet</p>';

    const du = m.driverUpdate;
    document.getElementById('detail-driver-update').innerHTML = du
      ? `<div class="info-card" style="border-left-color:${du.status==='updated'?'#4ade80':'#38bdf8'}">
          <div style="font-size:.75rem;color:#94a3b8">${du.timestamp}</div>
          <div style="font-size:.85rem;margin-top:.25rem">${du.status === 'updated' ? 'Drivers updated' : 'All drivers current'}</div>
          ${du.installed?.length ? '<div style="margin-top:.35rem;font-size:.78rem;color:#94a3b8">' + du.installed.join('<br>') + '</div>' : ''}
        </div>`
      : '<p class="muted">No update run yet</p>';

    // Events tab
    const events = m.events || [];
    document.getElementById('detail-events').innerHTML = events.length
      ? events.map(e => `<div class="event">
          <div class="evt-meta"><span>${e.time}</span><span>${e.source || ''}</span><span>ID: ${e.id || ''}</span></div>
          <div class="evt-msg">${e.message}</div>
        </div>`).join('')
      : '<p class="muted">No events recorded</p>';

    // Show panel, reset to overview tab
    document.getElementById('detail').classList.add('open');
    switchTab('overview');
  }

  async function assignCustomer() {
    const customerId = document.getElementById('detail-customer').value || null;
    await api(`/api/machines/${currentMachineId}`, {
      method: 'PATCH', body: JSON.stringify({ customer_id: customerId })
    });
    await loadAll();
  }

  function closeDetail() { document.getElementById('detail').classList.remove('open'); }

  function toggleGroup(header) {
    const group = header.closest('.customer-group');
    const id = group.dataset.id;
    group.classList.toggle('collapsed');
    const state = JSON.parse(localStorage.getItem('collapsed') || '{}');
    state[id] = group.classList.contains('collapsed');
    localStorage.setItem('collapsed', JSON.stringify(state));
  }

  async function deleteMachine() {
    if (!confirm('Remove this machine from the dashboard?')) return;
    await api(`/api/machines/${currentMachineId}`, { method: 'DELETE' });
    closeDetail();
    await loadAll();
  }

  async function sendCommand(command) {
    const labels = { reboot: 'reboot this machine', 'update-drivers': 'run a driver update', 'update-client': 'push a client update' };
    if (!confirm(`Send command to ${labels[command]}?`)) return;
    await api(`/api/machines/${currentMachineId}/command`, { method: 'POST', body: JSON.stringify({ command }) });
    alert(command === 'update-client' ? 'Update command sent. Client will download and reinstall.' : 'Command queued.');
  }

  function openNewCustomer() { document.getElementById('customer-modal').classList.add('open'); }
  function closeModal() {
    document.getElementById('customer-modal').classList.remove('open');
    document.getElementById('customer-name').value = '';
  }

  async function createCustomer() {
    const name = document.getElementById('customer-name').value.trim();
    if (!name) return;
    await api('/api/customers', { method: 'POST', body: JSON.stringify({ name }) });
    closeModal();
    await loadAll();
  }

  async function removeCustomer(id, e) {
    e.stopPropagation();
    if (!confirm('Delete this customer? Machines will become unassigned.')) return;
    await api(`/api/customers/${id}`, { method: 'DELETE' });
    await loadAll();
  }

  // --- Remote Terminal ---
  let termWs = null;

  function openTerminal() {
    if (!currentMachineId) return;
    closeTerminal();
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws/terminal?token=${token}&id=${currentMachineId}`;
    termWs = new WebSocket(url);
    document.getElementById('terminal-output').textContent = '';
    document.getElementById('terminal-title').textContent = `Terminal — ${currentMachineId}`;
    document.getElementById('terminal-container').classList.add('open');
    document.getElementById('term-cmd').focus();

    termWs.onmessage = (e) => {
      const out = document.getElementById('terminal-output');
      out.textContent += e.data;
      out.scrollTop = out.scrollHeight;
    };
    termWs.onclose = (e) => {
      const out = document.getElementById('terminal-output');
      out.textContent += `\n[Disconnected: ${e.reason || 'connection closed'}]\n`;
    };
  }

  function sendTermCmd() {
    const input = document.getElementById('term-cmd');
    if (!termWs || termWs.readyState !== 1 || !input.value) return;
    const out = document.getElementById('terminal-output');
    out.textContent += `PS> ${input.value}\n`;
    termWs.send(input.value);
    input.value = '';
  }

  function closeTerminal() {
    if (termWs) { termWs.close(); termWs = null; }
    document.getElementById('terminal-container').classList.remove('open');
  }
</script>
</body>
</html>
