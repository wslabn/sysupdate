<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SysUpdate Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login">
      <form onsubmit="App.login(event)">
        <h2>SysUpdate</h2>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div id="error"></div>
      </form>
    </div>

    <!-- Main layout -->
    <div id="main" style="display:none">
      <!-- Sidebar -->
      <nav id="sidebar">
        <div class="sidebar-header">
          <h3>SysUpdate</h3>
          <button class="btn-sm" onclick="App.showHome()">Home</button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Customers <button class="btn-sm" onclick="App.openCustomerModal()">+</button></div>
          <div id="customer-list"></div>
        </div>
        <div class="sidebar-footer">
          <button class="btn-sm" onclick="App.logout()">Logout</button>
        </div>
      </nav>

      <!-- Content area -->
      <div id="content">
        <!-- Home dashboard -->
        <div id="view-home"></div>
        <!-- Customer view -->
        <div id="view-customer" style="display:none"></div>
        <!-- Machine detail -->
        <div id="view-machine" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-bg" id="customer-modal">
    <div class="modal">
      <h3 id="customer-modal-title">New Customer</h3>
      <input type="hidden" id="customer-edit-id">
      <input type="text" id="customer-name" placeholder="Customer name">
      <input type="text" id="customer-email" placeholder="Email">
      <input type="text" id="customer-phone" placeholder="Phone">
      <input type="text" id="customer-address" placeholder="Address">
      <textarea id="customer-notes" placeholder="Notes"></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="App.closeModal()">Cancel</button>
        <button onclick="App.saveCustomer()">Save</button>
      </div>
    </div>
  </div>

  <!-- Terminal -->
  <div id="terminal-container">
    <div id="terminal-header">
      <span id="terminal-title">Terminal</span>
      <button class="btn-danger btn-sm" onclick="App.closeTerminal()">Close</button>
    </div>
    <div id="terminal-output"></div>
    <div id="terminal-input">
      <input type="text" id="term-cmd" placeholder="Type a command..." onkeydown="if(event.key==='Enter')App.sendTermCmd()">
      <button onclick="App.sendTermCmd()">Send</button>
    </div>
  </div>

  <!-- Screenshot modal -->
  <div class="modal-bg" id="screenshot-modal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3>Screenshot</h3>
        <button class="btn-sm btn-secondary" onclick="document.getElementById('screenshot-modal').classList.remove('open')">Close</button>
      </div>
      <img id="screenshot-img">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
